version: '3.8'

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: tax-dashboard-server
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/tailscale-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./docker/tailscale-serve.json:/config/tailscale-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped
    extra_hosts:
      - "${INVOICE_NINJA_DOMAIN}:127.0.0.1"

  tax-dashboard:
    build: .
    environment:
      - DATABASE_URL=postgresql://tax_user:${POSTGRES_PASSWORD}@db-postgres:5432/tax_dashboard
      - SECRET_KEY=${FLASK_SECRET_KEY}
    depends_on:
      - db-postgres
    restart: unless-stopped

  db-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=tax_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tax_dashboard
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh:ro
    restart: unless-stopped

  db-mariadb:
    image: mariadb:10.5
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=invoiceninja
      - MYSQL_USER=ninja
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

  invoiceninja-app:
    image: invoiceninja/invoiceninja:5
    environment:
      - APP_URL=http://${INVOICE_NINJA_DOMAIN}
      - APP_KEY=${INVOICE_NINJA_APP_KEY}
      - APP_ENV=production
      - DB_HOST=db-mariadb
      - DB_DATABASE=invoiceninja
      - DB_USERNAME=ninja
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - PDF_GENERATOR=snappdf
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REQUIRE_HTTPS=false
    volumes:
      - invoiceninja-public:/var/www/app/public
      - invoiceninja-storage:/var/www/app/storage
    depends_on:
      - db-mariadb
      - redis
    restart: unless-stopped

  invoiceninja-web:
    image: nginx:alpine
    volumes:
      - ./docker/invoiceninja-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - invoiceninja-public:/var/www/app/public
    depends_on:
      - invoiceninja-app
    restart: unless-stopped

  invoiceninja-cron:
    image: invoiceninja/invoiceninja:5
    entrypoint: |
      sh -c 'while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done'
    environment:
      - APP_URL=http://${INVOICE_NINJA_DOMAIN}
      - APP_KEY=${INVOICE_NINJA_APP_KEY}
      - APP_ENV=production
      - DB_HOST=db-mariadb
      - DB_DATABASE=invoiceninja
      - DB_USERNAME=ninja
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - PDF_GENERATOR=snappdf
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
    volumes:
      - invoiceninja-public:/var/www/app/public
      - invoiceninja-storage:/var/www/app/storage
    depends_on:
      - invoiceninja-app
    restart: unless-stopped

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBHOST=db-postgres
      - PAPERLESS_DBUSER=tax_user
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_OCR_LANGUAGE=deu+eng
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    depends_on:
      - db-postgres
      - redis
    restart: unless-stopped

volumes:
  tailscale-state:
  postgres-data:
  mariadb-data:
  invoiceninja-public:
  invoiceninja-storage:
  paperless-data:
  paperless-media:
